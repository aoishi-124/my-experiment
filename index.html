<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学実験室</title>
    <style>
        /* 1. 背景は薄いグレー */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        /* 2. 画面中央に大きな文字 */
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        /* 3. 実験を開始する青いボタン */
        .start-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .start-button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .start-button:active {
            transform: translateY(0);
        }

        /* カスタムアラート用のモーダルスタイル（alert()の代わり） */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }

        .modal-button {
            margin-top: 1.5rem;
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>心理学実験室へようこそ</h1>
        <button id="startBtn" class="start-button">実験を開始する</button>
    </div>

    <!-- カスタムメッセージボックス -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <p id="modalMessage" style="font-size: 1.5rem; font-weight: bold;"></p>
            <button class="modal-button" onclick="closeModal()">閉じる</button>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const modal = document.getElementById('modal');
        const modalMessage = document.getElementById('modalMessage');

        // 4. ボタンを押すとメッセージを表示
        // ※指示に従い、標準のalert()ではなく、よりモダンなカスタムメッセージボックスで実装しています。
        startBtn.addEventListener('click', () => {
            showModal('Hello World!');
        });

        function showModal(message) {
            modalMessage.textContent = message;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // 背景クリックで閉じる
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
